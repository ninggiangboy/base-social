spring.threads.virtual.enabled=true
# ========= Database =========
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# ========= Liquibase =========
spring.liquibase.change-log=classpath:db.changelog/public/db.changelog-master.yaml
spring.liquibase.drop-first=false
# ========= Quartz =========
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.properties.org.quartz.jobStore.tablePrefix=public.qrtz_
# ========= Redis =========
spring.data.redis.url=redis://${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}
spring.data.redis.timeout=2000
# ========= MyBatis =========
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.type-handlers-package=dev.ngb.infrastructure.persistence.mybatis.type_handler
# ========= Kafka =========
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=base-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# ========= GraphQL =========
spring.graphql.graphiql.enabled=true
spring.graphql.schema.locations=classpath*:graphql/**/
# ========= Scalar =========
scalar.enabled=true
# ========= Logging =========
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
logging.level.org.springframework.jdbc.support.JdbcTransactionManager=DEBUG
# ========= OpenTelemetry =========
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.url=${OTEL_METRICS_URL}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_URL}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGS_URL}
# ========= JWT =========
app.jwt.private-key=${JWT_PRIVATE_KEY}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}